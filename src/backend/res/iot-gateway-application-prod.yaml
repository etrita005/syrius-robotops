sentry:
  init:
    getDsnCron: "@every 5m"
    tag:
      serviceName: "iot-gateway"
      generateFullFilePath: "/var/log/cosmos/iot-gateway/sentryUpload.info"

blackbox:
  baseDir: "/var/log/cosmos/blackbox_task_collection"
  client:
    performTaskCron: "@every 20s"
    otaFileName: "otaTask.json"
    register:
      processName: "iot-gateway"
      method: "dbus"
      grpcUrl: "grpc://127.0.0.1:9000"
      dbusDest: "com.syriusrobotics.iot.iotgateway"
      dbusPath: "/internal/dbus/server/dbus_blackbox_client_service"
      isSystemBus: "true"
      registerCron: "@every 20s"
  server:
    register:
      grpcUrl: "grpc://127.0.0.1:10040"
      dbusDest: "com.syriusrobotics.iot.blackboxserver"
      dbusPath: "/internal/dbus/server/dbus_blackbox_server_service"
      isSystemBus: "true"

iotResidency:
  address: grpc://localhost:11090
  refreshCron: "@every 10s"
  dbus:
    dbusDest: "com.syriusrobotics.iot.iotresidency"
    dbusPath: "/internal/dbus/server/dbus_residency_service"
    getResidencyMethodName: "com.syriusrobotics.iot.iotresidency.GetResidencyFromLocalCache"