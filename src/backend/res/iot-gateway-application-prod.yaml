############################ common configuration #############################################
env: prod
logLevel: info
grpc:
  server:
    address: 0.0.0.0:9000
    network: tcp
db:
  badger:
    data:
      path: /opt/cosmos/data/iot-gateway/db/badger/data
      numMemTables: 2
      memTableSizeOfMB: 8
      valueLogFileSizeOfMB: 64
      valueLogGc: 0.3
monitor:
  enabled: false
http:
  server:
    listenAddress: 0.0.0.0:18820
dbus:
  enable: true
  isSystemBus: true
  name: com.syriusrobotics.iot.iotgateway
############################ common configuration #############################################

attribute:
  bootstrapper:
    syncThingIdCron: "@every 20s"
    syncOtaTokenCron: "@every 20s"
    dbus:
      dbusDest: "com.syriusrobotics.bootstrapper.iotdevice"
      dbusPath: "/com/syriusrobotics/bootstrapper/iotdevice"
      getThingInfoMethod: "com.syriusrobotics.bootstrapper.iotdevice.GetThingInfo"
      GetSharedAttributesByKeysMethod: "com.syriusrobotics.bootstrapper.iotdevice.GetSharedAttributesByKeys"
    mock:
      enabled: false
  uploader:
    uploadAttributesCron: "@every 3m"
  deviceIdLocalStoragePath: "/opt/cosmos/etc/secure/iot-gateway/device_id"
ota:
  controller:
    downloadedBaseDir: /opt/cosmos/ota/upgrade
    checkAndDownloadCron: "@every 30s"
    maxReDownloadTimes: 5
  downloader:
    minRemainingDiskSpaceTimesOfTotalDownloadedFile: 2
    bufSize: 32768
    sleepSecsBeforeRetryDownload: 1
    wakeupCountDuringBeforeRetryDownloadSleep: 5
  ddi:
    ddiFeedbackDeploymentCron: "@every 1m"
    feedbackMaxFailedTimesPerAction: 10000
    feedbackUnauthenticatedTimesPerAction: 5
    feedbackQueueMaxCapacity: 10
  checker:
    uploadOtaAttributesCron: "@every 30s"
credential:
  toBeDeleted:
    blackboxS3MockCredentials:
      - key: aws_access_key_id
        value: <AWS_ACCESS_KEY_ID_PLACEHOLDER>
        residencyCodeExpression: 'NewCNDev|NewCNSqa'
      - key: aws_secret_access_key
        value: <AWS_SECRET_ACCESS_KEY_PLACEHOLDER>
        residencyCodeExpression: 'NewCNDev|NewCNSqa'
      - key: aws_region
        value: 'cn-northwest-1'
        residencyCodeExpression: 'NewCNDev|NewCNSqa'
      - key: aws_bucket_name
        value: 'blackbox-report-context-no-prod'
        residencyCodeExpression: 'NewCNDev|NewCNSqa'
      - key: aws_access_key_id
        value: '<AWS_ACCESS_KEY_ID_PLACEHOLDER>'
        residencyCodeExpression: 'NewFwsCNProd'
      - key: aws_secret_access_key
