<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Flow Engine Playground</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
      color: #161616;
    }
    h1, h2 { margin-top: 0; }
    .container { max-width: 1400px; margin: 0 auto; }
    .panel {
      background: #fff;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    select, textarea, input[type="text"], button {
      font-family: inherit;
      font-size: 14px;
    }
    select, textarea, input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #c6c6c6;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    textarea { min-height: 160px; font-family: monospace; font-size: 13px; }
    .row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
    .row > div { flex: 1; }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #0f62fe;
      color: #fff;
      font-weight: 600;
    }
    button:hover { background: #0353e9; }
    button.secondary { background: #393939; }
    button.secondary:hover { background: #4c4c4c; }
    button.danger { background: #da1e28; }
    button.danger:hover { background: #b81921; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e0e0e0; }
    th { background: #f4f4f4; font-weight: 600; }
    tr:hover { background: #f4f4f4; }
    .state {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .state-PENDING { background: #e8e8e8; color: #525252; }
    .state-RUNNING { background: #c6e0ff; color: #0043ce; }
    .state-PAUSED { background: #fde607; color: #684e00; }
    .state-COMPLETED { background: #c6f6c6; color: #044317; }
    .state-FAILED { background: #ffd6d6; color: #750e0e; }
    .state-STOPPED { background: #e8e8e8; color: #161616; }
    .state-SKIPPED { background: #e8e8e8; color: #8d8d8d; }
    .actions { display: flex; gap: 6px; }
    .actions button { padding: 6px 10px; font-size: 12px; }
    .subtask-table { width: 100%; margin-top: 8px; font-size: 13px; }
    .subtask-table th, .subtask-table td { padding: 6px 10px; }
    .expand-btn {
      background: none;
      border: none;
      color: #0f62fe;
      padding: 0;
      font-size: 13px;
      cursor: pointer;
    }
    .expand-btn:hover { text-decoration: underline; background: none; }
    .event-log {
      height: 160px;
      overflow-y: auto;
      background: #262626;
      color: #f4f4f4;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
    }
    .event-log .entry { margin-bottom: 4px; }
    .filter-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    .filter-row select { width: auto; margin-bottom: 0; }
    .message { padding: 10px; border-radius: 4px; margin-bottom: 12px; font-size: 14px; }
    .message.success { background: #c6f6c6; color: #044317; }
    .message.error { background: #ffd6d6; color: #750e0e; }
    .hidden { display: none; }
    .result-box {
      background: #f4f4f4;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .result-label {
      font-size: 11px;
      font-weight: 600;
      color: #525252;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Task Flow Engine Playground</h1>

    <div id="msg" class="message hidden"></div>

    <div class="panel">
      <h2>Create Flow</h2>
      <div class="row">
        <div>
          <label for="flowType">Type</label>
          <select id="flowType">
            <option value="internal">Internal</option>
            <option value="user" selected>User</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <div class="toolbar">
            <button type="button" class="secondary" onclick="loadSequentialExample()">Sequential Example</button>
            <button type="button" class="secondary" onclick="loadParallelExample()">Parallel Example</button>
            <button type="button" class="secondary" onclick="loadDataPassingExample()">Data Passing Example</button>
          </div>
        </div>
      </div>
      <div class="two-col">
        <div>
          <label for="inputJson">Flow Input Parameters (JSON)</label>
          <textarea id="inputJson" placeholder='{"robotIp": "192.168.1.100", "sshUsername": "root"}'>{}</textarea>
        </div>
        <div>
          <label for="expectedResults">Expected Results (comma-separated)</label>
          <input type="text" id="expectedResults" placeholder="depA, depB, depC" />
          <label for="dagJson">DAG JSON</label>
          <textarea id="dagJson" placeholder='{ "tasks": { ... } }'></textarea>
        </div>
      </div>
      <button type="button" onclick="createFlow()">Create & Start Flow</button>
    </div>

    <div class="panel">
      <h2>Flows</h2>
      <div class="filter-row">
        <label for="filterType" style="margin-bottom:0">Filter:</label>
        <select id="filterType" onchange="loadFlows()">
          <option value="">All</option>
          <option value="internal">Internal</option>
          <option value="user">User</option>
        </select>
        <div style="flex:1"></div>
        <div class="toolbar">
          <button type="button" class="secondary" onclick="batchAction('pause')">Pause Selected</button>
          <button type="button" class="secondary" onclick="batchAction('resume')">Resume Selected</button>
          <button type="button" class="danger" onclick="batchAction('stop')">Stop Selected</button>
          <button type="button" class="danger" onclick="batchAction('delete')">Delete Selected</button>
        </div>
      </div>
      <div id="flowTableWrap">
        <table>
          <thead>
            <tr>
              <th style="width:30px"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
              <th>ID</th>
              <th>Type</th>
              <th>State</th>
              <th>Created At</th>
              <th>Finished At</th>
              <th>Sub-tasks</th>
              <th style="width:220px">Actions</th>
            </tr>
          </thead>
          <tbody id="flowTableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>Event Log (SSE)</h2>
      <div class="event-log" id="eventLog"></div>
    </div>
  </div>

  <script>
    const API = "/api";
    let flowsCache = [];
    let expandedFlows = new Set();

    function showMsg(text, isError) {
      const el = document.getElementById("msg");
      el.textContent = text;
      el.className = "message " + (isError ? "error" : "success");
      setTimeout(() => { el.className = "message hidden"; }, 4000);
    }

    function logEvent(text) {
      const el = document.getElementById("eventLog");
      const entry = document.createElement("div");
      entry.className = "entry";
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      el.appendChild(entry);
      el.scrollTop = el.scrollHeight;
      while (el.children.length > 100) el.removeChild(el.firstChild);
    }

    function loadSequentialExample() {
      document.getElementById("inputJson").value = JSON.stringify({
        taskName: "SequentialDemo",
        iterationCount: 2
      }, null, 2);
      document.getElementById("expectedResults").value = "depC";
      document.getElementById("dagJson").value = JSON.stringify({
        tasks: {
          taskA: {
            requires: [],
            provides: ["depA"],
            resolver: {
              name: "MockTask1",
              params: {
                name: "taskName",
                iterations: "iterationCount"
              },
              results: {
                done: "depA"
              }
            }
          },
          taskB: {
            requires: ["depA"],
            provides: ["depB"],
            resolver: {
              name: "MockTask2",
              params: {
                name: { value: "TaskB" },
                iterations: { value: 2 }
              },
              results: {
                done: "depB"
              }
            }
          },
          taskC: {
            requires: ["depB"],
            provides: ["depC"],
            resolver: {
              name: "MockTask3",
              params: {
                name: { value: "TaskC" },
                iterations: { value: 2 }
              },
              results: {
                done: "depC"
              }
            }
          }
        }
      }, null, 2);
    }

    function loadParallelExample() {
      document.getElementById("inputJson").value = JSON.stringify({
        projectName: "ParallelDemo"
      }, null, 2);
      document.getElementById("expectedResults").value = "depC";
      document.getElementById("dagJson").value = JSON.stringify({
        tasks: {
          taskA: {
            requires: [],
            provides: ["depA"],
            resolver: {
              name: "MockTask1",
              params: {
                name: "projectName",
                iterations: { value: 2 }
              },
              results: {
                done: "depA"
              }
            }
          },
          taskB: {
            requires: [],
            provides: ["depB"],
            resolver: {
              name: "MockTask2",
              params: {
                name: { value: "ParallelB" },
                iterations: { value: 3 }
              },
              results: {
                done: "depB"
              }
            }
          },
          taskC: {
            requires: ["depA", "depB"],
            provides: ["depC"],
            resolver: {
              name: "MockTask3",
              params: {
                name: { value: "JoinC" },
                iterations: { value: 1 }
              },
              results: {
                done: "depC"
              }
            }
          }
        }
      }, null, 2);
    }

    function loadDataPassingExample() {
      document.getElementById("inputJson").value = JSON.stringify({
        robotName: "Robot-Alpha",
        firmwareVersion: "2.1.0"
      }, null, 2);
      document.getElementById("expectedResults").value = "reportData";
      document.getElementById("dagJson").value = JSON.stringify({
        tasks: {
          collectInfo: {
            requires: [],
            provides: ["robotInfo"],
            resolver: {
              name: "MockTask1",
              params: {
                name: "robotName",
                iterations: { value: 2 }
              },
              results: {
                done: "robotInfo"
              }
            }
          },
          verifyFirmware: {
            requires: [],
            provides: ["firmwareCheck"],
            resolver: {
              name: "MockTask2",
              params: {
                name: { value: "FirmwareCheck" },
                iterations: { value: 1 }
              },
              results: {
                done: "firmwareCheck"
              }
            }
          },
          generateReport: {
            requires: ["robotInfo", "firmwareCheck"],
            provides: ["reportData"],
            resolver: {
              name: "MockTask3",
              params: {
                name: { value: "ReportGen" },
                iterations: { value: 1 }
              },
              results: {
                done: "reportData"
              }
            }
          }
        }
      }, null, 2);
    }

    async function createFlow() {
      const type = document.getElementById("flowType").value;
      const dagText = document.getElementById("dagJson").value.trim();
      const inputText = document.getElementById("inputJson").value.trim();
      const expectedText = document.getElementById("expectedResults").value.trim();

      if (!dagText) { showMsg("Please enter DAG JSON", true); return; }
      let dag;
      try { dag = JSON.parse(dagText); } catch (e) { showMsg("Invalid DAG JSON: " + e.message, true); return; }

      let input;
      if (inputText) {
        try { input = JSON.parse(inputText); } catch (e) { showMsg("Invalid Input JSON: " + e.message, true); return; }
      }

      let expectedResults;
      if (expectedText) {
        expectedResults = expectedText.split(",").map(s => s.trim()).filter(Boolean);
      }

      try {
        const res = await fetch(`${API}/flows`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type, dag, input, expectedResults })
        });
        if (!res.ok) throw new Error((await res.json()).error || "Failed");
        showMsg("Flow created and started", false);
        loadFlows();
      } catch (err) {
        showMsg(err.message, true);
      }
    }

    async function loadFlows() {
      const type = document.getElementById("filterType").value;
      try {
        const res = await fetch(`${API}/flows` + (type ? `?type=${type}` : ""));
        flowsCache = await res.json();
        renderFlows(flowsCache);
      } catch (err) {
        showMsg("Failed to load flows: " + err.message, true);
      }
    }

    function stateClass(state) {
      return "state state-" + state;
    }

    function formatResult(data) {
      if (!data) return '<span style="color:#8d8d8d">N/A</span>';
      return JSON.stringify(data, null, 2);
    }

    function renderFlows(flows) {
      const tbody = document.getElementById("flowTableBody");
      tbody.innerHTML = "";
      if (!flows.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#8d8d8d">No flows</td></tr>';
        return;
      }
      for (const f of flows) {
        const tr = document.createElement("tr");
        const taskCodes = Object.keys(f.taskStates || {});
        const isTerminal = ["COMPLETED", "FAILED", "STOPPED"].includes(f.state);

        let subtaskHtml = "";
        for (const c of taskCodes) {
          const taskResult = f.taskResults?.[c];
          subtaskHtml += `<tr>
            <td>${c}</td>
            <td><span class="${stateClass(f.taskStates[c])}">${f.taskStates[c]}</span></td>
            <td>${taskResult ? '<div class="result-box">' + formatResult(taskResult) + '</div>' : '<span style="color:#8d8d8d">-</span>'}</td>
          </tr>`;
        }

        let inputHtml = "";
        if (f.input && Object.keys(f.input).length > 0) {
          inputHtml = `<div class="result-label">Input</div><div class="result-box">${formatResult(f.input)}</div>`;
        }

        let resultsHtml = "";
        if (f.results && Object.keys(f.results).length > 0) {
          resultsHtml = `<div class="result-label">Flow Results</div><div class="result-box">${formatResult(f.results)}</div>`;
        }

        let expectedHtml = "";
        if (f.expectedResults && f.expectedResults.length > 0) {
          expectedHtml = `<div style="font-size:11px;color:#525252;margin-top:4px">Expected: ${f.expectedResults.join(", ")}</div>`;
        }

        tr.innerHTML = `
          <td><input type="checkbox" class="sel" data-id="${f.id}"></td>
          <td title="${f.id}">${f.id.slice(0, 8)}...</td>
          <td>${f.type}</td>
          <td><span class="${stateClass(f.state)}">${f.state}</span></td>
          <td>${new Date(f.createdAt).toLocaleString()}</td>
          <td>${f.finishedAt ? new Date(f.finishedAt).toLocaleString() : '<span style="color:#8d8d8d">-</span>'}</td>
          <td>
            <span style="color:#525252;font-size:12px">${taskCodes.length} tasks</span>
            <button type="button" class="expand-btn" onclick="toggleSubtasks('${f.id}')">Show/Hide</button>
            ${expectedHtml}
            <div id="sub-${f.id}" class="hidden">
              ${inputHtml}
              <table class="subtask-table">
                <thead><tr><th>Task</th><th>State</th><th>Result</th></tr></thead>
                <tbody>${subtaskHtml}</tbody>
              </table>
              ${resultsHtml}
            </div>
          </td>
          <td>
            <div class="actions">
              <button type="button" class="secondary" onclick="actionFlow('${f.id}', 'pause')" ${f.state !== "RUNNING" ? "disabled" : ""}>Pause</button>
              <button type="button" class="secondary" onclick="actionFlow('${f.id}', 'resume')" ${f.state !== "PAUSED" ? "disabled" : ""}>Resume</button>
              <button type="button" class="danger" onclick="actionFlow('${f.id}', 'stop')" ${isTerminal ? "disabled" : ""}>Stop</button>
              <button type="button" class="danger" onclick="actionFlow('${f.id}', 'delete')" ${!isTerminal ? "disabled" : ""}>Delete</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
        if (expandedFlows.has(f.id)) {
          const subEl = document.getElementById("sub-" + f.id);
          if (subEl) subEl.classList.remove("hidden");
        }
      }
    }

    function toggleSubtasks(id) {
      const el = document.getElementById("sub-" + id);
      el.classList.toggle("hidden");
      if (el.classList.contains("hidden")) {
        expandedFlows.delete(id);
      } else {
        expandedFlows.add(id);
      }
    }

    async function actionFlow(id, action) {
      try {
        let res;
        if (action === "delete") {
          res = await fetch(`${API}/flows/${id}`, { method: "DELETE" });
        } else {
          res = await fetch(`${API}/flows/${id}/${action}`, { method: "POST" });
        }
        if (!res.ok) throw new Error((await res.json()).error || "Failed");
        showMsg(`Flow ${action}d`, false);
        loadFlows();
      } catch (err) {
        showMsg(err.message, true);
      }
    }

    function getSelectedIds() {
      return Array.from(document.querySelectorAll(".sel:checked")).map(el => el.dataset.id);
    }

    function toggleSelectAll() {
      const checked = document.getElementById("selectAll").checked;
      document.querySelectorAll(".sel").forEach(el => el.checked = checked);
    }

    async function batchAction(action) {
      const ids = getSelectedIds();
      if (!ids.length) { showMsg("No flows selected", true); return; }
      try {
        const res = await fetch(`${API}/flows/batch/${action}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ids })
        });
        if (!res.ok) throw new Error((await res.json()).error || "Failed");
        showMsg(`Batch ${action} completed`, false);
        document.getElementById("selectAll").checked = false;
        loadFlows();
      } catch (err) {
        showMsg(err.message, true);
      }
    }

    function connectSSE() {
      const evtSource = new EventSource(`${API}/events`);
      evtSource.addEventListener("connected", () => {
        logEvent("SSE connected");
      });
      evtSource.addEventListener("task-flow-engine/flow-created", (e) => {
        const data = JSON.parse(e.data);
        logEvent(`Flow created: ${data.id?.slice(0,8)}... (${data.type}) - ${data.state}`);
        loadFlows();
      });
      evtSource.addEventListener("task-flow-engine/flow-updated", (e) => {
        const data = JSON.parse(e.data);
        logEvent(`Flow updated: ${data.id?.slice(0,8)}... - ${data.state}`);
        const idx = flowsCache.findIndex(f => f.id === data.id);
        if (idx >= 0) {
          flowsCache[idx] = data;
          renderFlows(flowsCache);
        } else {
          loadFlows();
        }
      });
      evtSource.addEventListener("task-flow-engine/task-updated", (e) => {
        const data = JSON.parse(e.data);
        logEvent(`Task updated: ${data.flowId?.slice(0,8)}... / ${data.taskName} -> ${data.state}`);
        const idx = flowsCache.findIndex(f => f.id === data.flowId);
        if (idx >= 0 && flowsCache[idx].taskStates) {
          flowsCache[idx].taskStates[data.taskName] = data.state;
          renderFlows(flowsCache);
        }
      });
      evtSource.addEventListener("task-flow-engine/task-result", (e) => {
        const data = JSON.parse(e.data);
        logEvent(`Task result: ${data.flowId?.slice(0,8)}... / ${data.taskName} = ${JSON.stringify(data.result)}`);
        const idx = flowsCache.findIndex(f => f.id === data.flowId);
        if (idx >= 0) {
          if (!flowsCache[idx].taskResults) flowsCache[idx].taskResults = {};
          flowsCache[idx].taskResults[data.taskName] = data.result;
          renderFlows(flowsCache);
        }
      });
      evtSource.addEventListener("task-flow-engine/flow-completed", (e) => {
        const data = JSON.parse(e.data);
        logEvent(`Flow completed: ${data.flowId?.slice(0,8)}... - ${data.state} | Results: ${JSON.stringify(data.results)}`);
        const idx = flowsCache.findIndex(f => f.id === data.flowId);
        if (idx >= 0) {
          flowsCache[idx].state = data.state;
          flowsCache[idx].results = data.results;
          flowsCache[idx].finishedAt = data.finishedAt;
          renderFlows(flowsCache);
        } else {
          loadFlows();
        }
      });
      evtSource.addEventListener("task-flow-engine/flow-removed", (e) => {
        const data = JSON.parse(e.data);
        logEvent(`Flow removed: ${data.flowId?.slice(0,8)}...`);
        loadFlows();
      });
      evtSource.onerror = () => {
        logEvent("SSE error / reconnecting...");
      };
    }

    loadSequentialExample();
    loadFlows();
    connectSSE();
    setInterval(loadFlows, 5000);
  </script>
</body>
</html>
